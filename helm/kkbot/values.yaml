# Default values for kkbot
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/your-org/kkbot
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: kkbot.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: kkbot-tls
      hosts:
        - kkbot.example.com

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Application configuration
config:
  # ASPNETCORE_ENVIRONMENT
  environment: "Production"
  
  # Connection strings
  connectionStrings:
    kkbotDb: "DataSource=/app/data/kkbot.db"
  
  # Security settings (use secrets for production!)
  security:
    secretsPath: "/app/data/secrets.json"
    encryptionPassphrase: ""  # Set via secret
    encryptionSalt: ""        # Set via secret
  
  # Plugins
  plugins:
    path: "/app/plugins"

# Persistence
persistence:
  enabled: true
  data:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 5Gi
    mountPath: /app/data
  logs:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 2Gi
    mountPath: /app/logs
  plugins:
    enabled: true
    storageClass: ""
    accessMode: ReadOnlyMany
    size: 1Gi
    mountPath: /app/plugins

# Secrets (create separately or use external secret operator)
secrets:
  create: false
  encryptionPassphrase: ""
  encryptionSalt: ""
  postgresPassword: ""
  grafanaPassword: ""

# PostgreSQL dependency (optional)
postgresql:
  enabled: false
  auth:
    database: kkbot
    username: kkbot
    password: ""
  primary:
    persistence:
      size: 10Gi

# Redis dependency (optional)
redis:
  enabled: false
  auth:
    enabled: false
  master:
    persistence:
      size: 1Gi

# Monitoring
monitoring:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
  grafana:
    enabled: true
    dashboards:
      enabled: true

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 40
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Node selector, tolerations, affinity
nodeSelector: {}
tolerations: []
affinity: {}