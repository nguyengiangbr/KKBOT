{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kkbot.fullname" . }}-secrets
  labels:
    {{- include "kkbot.labels" . | nindent 4 }}
type: Opaque
stringData:
  encryption-passphrase: {{ .Values.secrets.encryptionPassphrase | quote }}
  encryption-salt: {{ .Values.secrets.encryptionSalt | quote }}
  {{- if .Values.secrets.postgresPassword }}
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.grafanaPassword }}
  grafana-password: {{ .Values.secrets.grafanaPassword | quote }}
  {{- end }}
{{- end }}