apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kkbot.fullname" . }}
  labels:
    {{- include "kkbot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kkbot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "kkbot.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kkbot.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.config.environment | quote }}
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ConnectionStrings__KkbotDb
              value: {{ .Values.config.connectionStrings.kkbotDb | quote }}
            - name: Security__SecretsPath
              value: {{ .Values.config.security.secretsPath | quote }}
            - name: Security__EncryptionPassphrase
              valueFrom:
                secretKeyRef:
                  name: {{ include "kkbot.fullname" . }}-secrets
                  key: encryption-passphrase
                  optional: true
            - name: Security__EncryptionSalt
              valueFrom:
                secretKeyRef:
                  name: {{ include "kkbot.fullname" . }}-secrets
                  key: encryption-salt
                  optional: true
            - name: Plugins__Path
              value: {{ .Values.config.plugins.path | quote }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
            - name: plugins
              mountPath: /app/plugins
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.data.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kkbot.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: logs
          {{- if .Values.persistence.logs.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kkbot.fullname" . }}-logs
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: plugins
          {{- if .Values.persistence.plugins.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kkbot.fullname" . }}-plugins
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}